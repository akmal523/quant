site_name: Quant-AI
site_description: A daily portfolio manager for one investor on Trade Republic
repo_url: https://github.com/akmal523/quant
site_url: https://akmal523.github.io/quant/

# The archived ruling log links into the repository; it is read on GitHub,
# not built into the site.
exclude_docs: |
  history/

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true

nav:
  - Home: index.md
  - API Reference: api.md
  - Stub and fallback policy: stub_policy.md
  - Backup and restore: backup.md
  - Performance: performance.md

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
