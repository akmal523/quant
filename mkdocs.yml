site_name: Quant-AI
site_description: Institutional-grade systematic equity pipeline
exclude_docs: |
  launch.md
repo_url: https://github.com/akmal523/quant
site_url: https://akmal523.github.io/quant/

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true

nav:
  - Home: index.md
  - API Reference: api.md

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
