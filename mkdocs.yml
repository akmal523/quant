site_name: Quant-AI
site_description: Institutional-grade systematic equity pipeline
repo_url: https://github.com/akmal523/quant
site_url: https://akmal523.github.io/quant/

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true

nav:
  - Home: index.md
  - API Reference: api.md
  - How the system talks to you: conversation.md
  - Your first week: first_week.md
  - Backup and restore: backup.md
  - Migration (v10.7.0): migration_v10.7.0.md
  - Migration (v10.6.2): migration_v10.6.2.md
  - Performance: performance.md

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
