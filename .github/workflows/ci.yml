name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps CI lightweight; pyproject cannot express the
          # extra index under PEP 621.
          pip install -e ".[test]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run test suite with coverage
        # Coverage floor lives in .coveragerc (fail_under). --strict-markers is
        # set in pyproject addopts. -n auto parallelises across CPU cores.
        run: python -m pytest -n auto --cov=quant --cov-report=xml --cov-report=term

      - name: Golden snapshot gate
        run: python -m pytest tests/test_golden_snapshot.py -q

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
