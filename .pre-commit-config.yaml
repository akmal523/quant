# Pre-commit hooks. Install once: `pre-commit install`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # v10.8.0 (1.1): user state (positions, cash, tiers, backups, database) must
  # never be committed. Fails when a tracked path matches a user-state pattern.
  - repo: local
    hooks:
      - id: no-user-state
        name: no user state tracked
        entry: python scripts/check_no_user_state.py
        language: system
        pass_filenames: false
        always_run: true
