[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-ai"
version = "10.6.1"
description = "Institutional-grade systematic equity pipeline for a EUR-native family office."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Quant-AI contributors" }]
keywords = [
    "quantitative-finance",
    "systematic-trading",
    "polars",
    "duckdb",
    "portfolio-optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.40",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "tenacity>=8.2",
    "duckdb>=1.0.0",
    "platformdirs>=4.0",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "selectolax>=0.3.16",
    "polars>=1.0",
    "pyarrow>=15.0",
    "cvxpy>=1.4",
    "hmmlearn>=0.3",
    "scikit-learn>=1.4",
    "arch>=6.0",
    "sec-edgar-downloader>=5.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.18", "requests>=2.31"]
test = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "pytest-xdist>=3.5.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
    "bump-my-version>=0.24.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "pyright>=1.1.370",
    "build>=1.2.0",
]

[project.scripts]
quant = "quant.cli:main"

[project.urls]
Homepage = "https://github.com/akmal523/quant"
Repository = "https://github.com/akmal523/quant"
Changelog = "https://github.com/akmal523/quant/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["quant"]

[tool.hatch.build.targets.sdist]
include = [
    "quant",
    "tests",
    "scripts",
    "data",
    "README.md",
    "CONTEXT.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow",
    "network: marks tests that require network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["quant"]

[tool.bumpversion]
current_version = "10.6.1"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "quant/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""
