[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-ai"
version = "10.8.11"
description = "A daily portfolio manager for one EUR-based investor on Trade Republic."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Quant-AI contributors" }]
keywords = [
    "portfolio-management",
    "personal-finance",
    "trade-republic",
    "duckdb",
    "streamlit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",            # data/account.yaml
    "duckdb>=1.0.0",
    "platformdirs>=4.0",
    "feedparser>=6.0",        # news headlines (RSS)
    "lxml>=5.0",              # pd.read_html (universe builder)
    "jinja2>=3.1",            # pandas Styler (the amber Entry-check rows)
]

[project.optional-dependencies]
# v10.8.0 (1.3): the real minimum. The UI uses st.segmented_control (1.40) and
# the width="stretch" argument on charts/tables/buttons (1.49).
dashboard = ["streamlit>=1.49", "plotly>=5.18"]
# v10.8.2: the news-sentiment stack is optional. Without it the Market tab says
# so in one line and the rest of the app is unaffected.
news = ["torch>=2.2", "transformers>=4.40"]
test = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "pytest-xdist>=3.5.0", "hypothesis>=6.100"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
    "bump-my-version>=0.24.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "pyright>=1.1.370",
    "build>=1.2.0",
    "mutmut>=3.0",
]

[project.scripts]
quant = "quant.cli:main"

[project.urls]
Homepage = "https://github.com/akmal523/quant"
Documentation = "https://akmal523.github.io/quant"
Repository = "https://github.com/akmal523/quant"
Changelog = "https://github.com/akmal523/quant/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["quant"]

[tool.hatch.build.targets.sdist]
include = [
    "quant",
    "tests",
    "scripts",
    "data",
    "README.md",
    "CONTEXT.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow",
    "network: marks tests that require network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# The project uses the short aliases C (quant.ui.copy) and P (quant.ui.palette)
# consistently across the UI, CLI, and tests; N812 is accepted project-wide.
ignore = ["N812"]

[tool.ruff.lint.isort]
known-first-party = ["quant"]

[tool.ruff.lint.per-file-ignores]
# Matrix notation (X, R, N, T) is the standard in the quant modules; renaming
# these to lowercase would hurt readability of the linear-algebra code.
"tests/test_institutional.py" = ["N806"]

[tool.bumpversion]
current_version = "10.8.11"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "quant/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

# v10.7.5 (Part 4): mutate ONLY the math core. The kill threshold is 90 percent;
# survivors are listed in tests/mutation_survivors_allowlist.txt.
# source_paths copies the whole package (so the mutants tree is importable);
# only_mutate restricts mutation to the math core.
[tool.mutmut]
source_paths = ["quant", "scripts"]
only_mutate = [
    "quant/engine/score_model.py",
    "quant/engine/flows.py",
    "quant/engine/sizing.py",
    "quant/engine/action_taxonomy.py",
    "quant/engine/mtm.py",
]
# Only the tests that cover the math core run per mutant: fast, and free of the
# data/ dependency the full suite has.
pytest_add_cli_args_test_selection = [
    "tests/test_stub_grid.py",
    "tests/test_advice_grid.py",
    "tests/test_decision_rules.py",
    "tests/test_core_sizing_flows.py",
    "tests/test_core_score_model.py",
    "tests/test_core_action_taxonomy.py",
    "tests/test_core_mtm.py",
    "tests/test_properties.py",
    "tests/test_regression_grid.py",
    "tests/test_fallback_registry.py",
    "tests/test_v10_8_10.py",         # scores, splits, store
]
runner = "python -m pytest -x -q -p no:cacheprovider"
